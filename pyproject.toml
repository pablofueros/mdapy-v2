[project]
name = "mdapy-v2"
version = "2.3.0"
description = "FAST Maximum Dissimilarity Algorithm in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Garcia", email = "pablofueros@gmail.com" }]
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11.2,<2",
]

[project.optional-dependencies]
numba = [
    "numba>=0.68.1,<0.69",
]

[dependency-groups]
dev = [
    "plotly>=7.1,<8",
    "pytest>=7.0,<10",
    "pytest-cov>=4.1,<7",
    "ruff>=0.16.10,<1",
    "ty>=0.0.85,<1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdapy"

[project.urls]
Repository = "https://github.com/pablofueros/mdapy-v2"
Issues = "https://github.com/pablofueros/mdapy-v2/issues"
"Original project" = "https://github.com/IHCantabria/mdapy"

[tool.ruff]
lint.extend-select = ["I"]
